name: Bug report
description: A plugin from the catalog does not install or does not show up in your agent.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: If a skill installs but tells the agent something wrong, open the issue in the tool's repository instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      multiple: true
      options:
        - cds-guard
        - eslint-plugin-cds
        - The whole catalog
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Codex
        - GitHub Copilot CLI
        - Claude Code
        - skills CLI (npx skills)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Agent version
      description: The version of the agent or CLI, for example the output of `codex --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Node.js version.
      placeholder: Windows 11, Node 22.12
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Commands and output
      description: The commands you ran and what they printed. It is formatted as code automatically.
      render: shell
